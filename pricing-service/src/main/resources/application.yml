spring:
  application:
    name: pricing-service
  flyway:
    schemas: pricing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pricing

server:
  port: 8083

app:
  dev:
    # Development-only: mode=slow sleeps this long before responding, long enough to exceed
    # api-server's Resilience4j time limiter (Phase 6) and trigger its circuit breaker.
    slow-delay: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash
