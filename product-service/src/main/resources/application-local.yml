spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gatewaysample}
    username: ${POSTGRES_USER:gatewaysample}
    password: ${POSTGRES_PASSWORD:dev-only-postgres-password}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/gateway-sample/protocol/openid-connect/certs}

app:
  security:
    jwt:
      issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/gateway-sample}

logging:
  level:
    root: INFO
    com.example.gatewaysample: DEBUG
