spring:
  application:
    name: product-service
  flyway:
    schemas: product
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product

server:
  port: 8082

app:
  dev:
    # Development-only: mode=slow sleeps this long before responding, long enough to exceed
    # api-server's Resilience4j time limiter (Phase 6) and trigger its circuit breaker.
    slow-delay: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
