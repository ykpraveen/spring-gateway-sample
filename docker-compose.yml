networks:
  gateway-sample-net:
    name: ${COMPOSE_NETWORK:-gateway-sample-net}

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - gateway-sample-net

  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    ports:
      - "${API_SERVER_PORT:-8081}:8081"
    networks:
      - gateway-sample-net

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "${PRODUCT_SERVICE_PORT:-8082}:8082"
    networks:
      - gateway-sample-net

  pricing-service:
    build:
      context: .
      dockerfile: pricing-service/Dockerfile
    ports:
      - "${PRICING_SERVICE_PORT:-8083}:8083"
    networks:
      - gateway-sample-net

  web-ui:
    build:
      context: ./web-ui
    ports:
      - "${WEB_UI_PORT:-8090}:80"
    networks:
      - gateway-sample-net

# No depends_on/healthcheck-gated startup ordering yet: these services have no
# inter-service calls until Phase 5 (gateway routing) and Phase 6 (api-server
# delegation), and no database/JWT/Redis wiring until Phases 2-4. Once that
# logic lands, add `depends_on: condition: service_healthy` against the infra
# services (and each other) using each app's /actuator/health.
