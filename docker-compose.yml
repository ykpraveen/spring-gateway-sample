networks:
  gateway-sample-net:
    name: ${COMPOSE_NETWORK:-gateway-sample-net}

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - gateway-sample-net

  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    ports:
      - "${API_SERVER_PORT:-8081}:8081"
    networks:
      - gateway-sample-net

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "${PRODUCT_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gateway-sample-net

  pricing-service:
    build:
      context: .
      dockerfile: pricing-service/Dockerfile
    ports:
      - "${PRICING_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gateway-sample-net

  web-ui:
    build:
      context: ./web-ui
    ports:
      - "${WEB_UI_PORT:-8090}:80"
    networks:
      - gateway-sample-net

# gateway, api-server, and web-ui still have no depends_on/healthcheck-gated
# startup ordering: they have no inter-service calls until Phase 5 (gateway
# routing) and Phase 6 (api-server delegation), and no JWT/Redis wiring until
# Phases 3-4. product-service and pricing-service already depend on postgres
# above, since their Phase 2 Flyway migrations need it healthy at startup.
