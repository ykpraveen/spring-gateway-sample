networks:
  gateway-sample-net:
    name: ${COMPOSE_NETWORK:-gateway-sample-net}
    ipam:
      config:
        - subnet: 172.28.1.0/24

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_FLYWAY_USER: ${POSTGRES_USER}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: ${KEYCLOAK_ISSUER_URI}
      APP_SECURITY_API_KEY_PEPPER: ${API_KEY_PEPPER}
      API_SERVER_URI: http://api-server:8081
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN}
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - gateway-sample-net

  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    ports:
      - "${API_SERVER_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: ${KEYCLOAK_ISSUER_URI}
      PRODUCT_SERVICE_URI: http://product-service:8082
      PRICING_SERVICE_URI: http://pricing-service:8083
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      keycloak:
        condition: service_healthy
      product-service:
        condition: service_started
      pricing-service:
        condition: service_started
    networks:
      - gateway-sample-net

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "${PRODUCT_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: ${KEYCLOAK_ISSUER_URI}
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - gateway-sample-net

  pricing-service:
    build:
      context: .
      dockerfile: pricing-service/Dockerfile
    ports:
      - "${PRICING_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: ${KEYCLOAK_ISSUER_URI}
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - gateway-sample-net

  web-ui:
    build:
      context: ./web-ui
    ports:
      - "${WEB_UI_PORT:-8090}:80"
    networks:
      - gateway-sample-net

# All four Spring services now depend on keycloak (Phase 3 JWT validation).
# gateway also depends on postgres (api_client schema/table) and redis
# (validated API-client metadata cache) as of Phase 4. api-server depends on
# product-service/pricing-service (WebClient delegation, Phase 6) but only
# with service_started, since neither defines a healthcheck; api-server's own
# circuit breakers and cached fallbacks tolerate them not being ready yet.
# web-ui has no inter-service calls until Phase 7, so it still has no
# depends_on/healthcheck-gated startup ordering.
