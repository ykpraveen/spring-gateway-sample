networks:
  gateway-sample-net:
    name: ${COMPOSE_NETWORK:-gateway-sample-net}

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: ${KEYCLOAK_ISSUER_URI}
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - gateway-sample-net

  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    ports:
      - "${API_SERVER_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: ${KEYCLOAK_ISSUER_URI}
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - gateway-sample-net

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "${PRODUCT_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: ${KEYCLOAK_ISSUER_URI}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - gateway-sample-net

  pricing-service:
    build:
      context: .
      dockerfile: pricing-service/Dockerfile
    ports:
      - "${PRICING_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: ${KEYCLOAK_ISSUER_URI}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - gateway-sample-net

  web-ui:
    build:
      context: ./web-ui
    ports:
      - "${WEB_UI_PORT:-8090}:80"
    networks:
      - gateway-sample-net

# All four Spring services now depend on keycloak (Phase 3 JWT validation).
# web-ui has no inter-service calls or Redis wiring until Phase 4/5/7, so it
# still has no depends_on/healthcheck-gated startup ordering.
