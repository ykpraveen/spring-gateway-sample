spring:
  application:
    name: gateway
  flyway:
    schemas: gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=X-API-Key
          routes:
            - id: products-read
              uri: ${API_SERVER_URI:http://localhost:8081}
              predicates:
                - Path=/api/products/**
                - Method=GET
              metadata:
                rate-limit-category: read
                required-authority: catalog.read
            - id: products-write
              uri: ${API_SERVER_URI:http://localhost:8081}
              predicates:
                - Path=/api/products/**
                - Method=POST,PUT,PATCH,DELETE
              metadata:
                rate-limit-category: write
                required-authority: catalog.write
            - id: prices-read
              uri: ${API_SERVER_URI:http://localhost:8081}
              predicates:
                - Path=/api/prices/**
                - Method=GET
              metadata:
                rate-limit-category: read
                required-authority: pricing.read
            - id: prices-write
              uri: ${API_SERVER_URI:http://localhost:8081}
              predicates:
                - Path=/api/prices/**
                - Method=POST,PUT,PATCH,DELETE
              metadata:
                rate-limit-category: write
                required-authority: pricing.write

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:8090}
  rate-limit:
    route:
      read:
        replenish-rate: 10
        burst-capacity: 20
      write:
        replenish-rate: 2
        burst-capacity: 5
    client:
      replenish-rate: 5
      burst-capacity: 10
    ip:
      replenish-rate: 8
      burst-capacity: 15
    trusted-proxies: []
