spring:
  application:
    name: api-server

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash

app:
  downstream:
    product-service:
      base-url: ${PRODUCT_SERVICE_URI:http://localhost:8082}
    pricing-service:
      base-url: ${PRICING_SERVICE_URI:http://localhost:8083}
  cache:
    max-size: 500
    ttl: 5m
  circuit-breaker:
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    slow-call-duration-threshold: 2s
    slow-call-rate-threshold: 50
    wait-duration-in-open-state: 10s
    permitted-calls-in-half-open-state: 3
    time-limiter-timeout: 3s
